[project]
name = "fire-hotspots-bolivia"
version = "0.1.0"
description = "Weekly forecasting of VIIRS fire hotspots in Bolivia with climate covariates (Time Series Analysis I, MIA UBA)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = ["pytest>=8", "ipykernel>=6", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fires"]

[tool.pytest.ini_options]
testpaths = ["tests"]
